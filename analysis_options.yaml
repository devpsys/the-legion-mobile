# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    # Generated by `flutter gen-l10n` — not hand maintained.
    - lib/core/l10n/gen/**

  errors:
    # Treat missing awaits / unawaited futures as build-breaking mistakes.
    unawaited_futures: error
    cancel_subscriptions: error
    close_sinks: error

linter:
  rules:
    # Immutability & null safety hygiene.
    prefer_final_fields: true
    prefer_final_locals: true
    always_declare_return_types: true
    # Named parameters cannot be private (`this._field` is illegal), so
    # dependencies kept in private fields always trip this rule.
    prefer_initializing_formals: false

    # Correctness.
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    avoid_returning_null_for_void: true

    # Readability & consistency.
    directives_ordering: true
    prefer_single_quotes: true
    sort_child_properties_last: true

    # Architecture guardrails.
    # Domain layer must stay free of framework imports.
    implementation_imports: true