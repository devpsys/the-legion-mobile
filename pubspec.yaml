name: the_legion_mobile
description: "The Legion — a feature-based Clean Architecture Flutter application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Networking & dependency injection
  dio: ^5.11.1
  get_it: ^9.3.0

  # Local persistence
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  flutter_secure_storage: ^11.2.0

  # Navigation, logging & i18n
  go_router: ^18.0.2
  logger: ^2.8.0
  intl: ^0.20.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true